schema: spec-driven

context: |
  Language: ru — все артефакты OpenSpec пишутся на русском.
  Структурные заголовки и ключевые слова SHALL/MUST остаются на английском.
  Задача считается выполненной только при чистом `make format` и зелёной сборке/тестах
  (приоритет — xcode MCP, фоллбек — make build/test).
  Read-only режим: сетевые фичи и авторизация не возвращаются; новые sync-флаги
  (isSynced/shouldDelete/lastModified) не добавляются — они deprecated.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
